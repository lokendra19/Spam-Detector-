<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SpamShield – Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cyan:#00f5ff;--purple:#a855f7;--green:#00ff88;--red:#ff4757;
  --bg:#050810;--card:#0d1117;--border:rgba(255,255,255,.08);
  --text:#e2e8f0;--muted:#64748b;
}
body{min-height:100vh;background:var(--bg);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

/* ── Canvas particle bg ── */
#particles{position:fixed;inset:0;z-index:0}

/* ── Gradient orbs ── */
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.35;animation:drift 12s ease-in-out infinite alternate;z-index:0}
.orb1{width:500px;height:500px;background:radial-gradient(circle,var(--cyan),transparent);top:-100px;left:-100px;animation-delay:0s}
.orb2{width:400px;height:400px;background:radial-gradient(circle,var(--purple),transparent);bottom:-80px;right:-80px;animation-delay:-4s}
.orb3{width:300px;height:300px;background:radial-gradient(circle,var(--green),transparent);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-8s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,20px) scale(1.1)}}

/* ── Card ── */
.card{position:relative;z-index:10;width:100%;max-width:440px;margin:1rem;
  background:rgba(13,17,23,.85);border:1px solid var(--border);border-radius:24px;
  backdrop-filter:blur(24px);padding:2.5rem 2.5rem 2rem;
  box-shadow:0 0 60px rgba(0,245,255,.08),0 24px 64px rgba(0,0,0,.6);
  animation:slideUp .6s cubic-bezier(.16,1,.3,1) both}
@keyframes slideUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}

/* ── Logo / header ── */
.logo{text-align:center;margin-bottom:2rem}
.logo-icon{font-size:3rem;display:block;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px var(--cyan))}50%{transform:scale(1.08);filter:drop-shadow(0 0 20px var(--cyan))}}
.logo h1{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:700;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:.4rem}
.logo p{color:var(--muted);font-size:.85rem;margin-top:.25rem}

/* ── Tabs ── */
.tabs{display:flex;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;margin-bottom:1.8rem;gap:4px}
.tab{flex:1;text-align:center;padding:.55rem;border-radius:9px;cursor:pointer;font-size:.875rem;font-weight:500;
  color:var(--muted);border:none;background:transparent;transition:all .25s}
.tab.active{background:linear-gradient(135deg,rgba(0,245,255,.15),rgba(168,85,247,.15));
  color:var(--cyan);border:1px solid rgba(0,245,255,.2)}

/* ── Form ── */
.form-group{margin-bottom:1.1rem;position:relative}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.45rem}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none;transition:color .25s}
input[type=text],input[type=password]{
  width:100%;padding:.75rem .9rem .75rem 2.6rem;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-size:.95rem;font-family:'Inter',sans-serif;
  outline:none;transition:all .25s}
input:focus{border-color:var(--cyan);background:rgba(0,245,255,.05);box-shadow:0 0 0 3px rgba(0,245,255,.1)}
input:focus + svg,input:focus ~ svg,.input-wrap:focus-within svg{color:var(--cyan)}

/* ── Button ── */
.btn{width:100%;padding:.85rem;border:none;border-radius:12px;font-size:1rem;font-weight:600;
  cursor:pointer;transition:all .25s;position:relative;overflow:hidden;margin-top:.5rem}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#050810}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,245,255,.35)}
.btn-primary:active{transform:translateY(0)}
.btn-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .25s}
.btn-primary:hover::after{opacity:1}

/* ── Alert ── */
.alert{padding:.75rem 1rem;border-radius:10px;font-size:.875rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;animation:fadeIn .3s}
.alert-error{background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.3);color:#ff6b7a}
.alert-success{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.25);color:var(--green)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* ── Footer ── */
.card-footer{text-align:center;margin-top:1.4rem;font-size:.8rem;color:var(--muted)}
.card-footer a{color:var(--cyan);text-decoration:none;font-weight:500}
.card-footer a:hover{text-decoration:underline}

/* ── Scan lines overlay ── */
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,255,.015) 2px,rgba(0,245,255,.015) 4px);pointer-events:none;z-index:5}

/* ── Stats bar ── */
.stats{display:flex;gap:.75rem;margin-bottom:1.8rem}
.stat{flex:1;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:.7rem .5rem}
.stat-num{font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:.15rem}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="scanlines"></div>

<div class="card">
  <div class="logo">
    <span class="logo-icon">🛡️</span>
    <h1>SpamShield</h1>
    <p>AI-powered email threat detection</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num">99.2%</div><div class="stat-lbl">Accuracy</div></div>
    <div class="stat"><div class="stat-num">6</div><div class="stat-lbl">Threat Types</div></div>
    <div class="stat"><div class="stat-num">AI</div><div class="stat-lbl">Powered</div></div>
  </div>

  <div class="tabs">
    <button class="tab {% if mode=='login' %}active{% endif %}" onclick="location.href='{{ url_for('login') }}'">Sign In</button>
    <button class="tab {% if mode=='signup' %}active{% endif %}" onclick="location.href='{{ url_for('signup') }}'">Create Account</button>
  </div>

  {% if error %}
  <div class="alert alert-error">⚠️ {{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="alert alert-success">✅ {{ success }}</div>
  {% endif %}

  {% if mode == 'login' %}
  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <input type="text" name="username" placeholder="Enter your username" required autocomplete="username">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Sign In →</button>
  </form>
  {% else %}
  <form method="POST" action="{{ url_for('signup') }}">
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <input type="text" name="username" placeholder="Choose a username" required>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" name="password" placeholder="Create a password" required>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <input type="password" name="confirm" placeholder="Repeat your password" required>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Create Account →</button>
  </form>
  {% endif %}

  <div class="card-footer">
    Secured with bcrypt · ML-powered detection
  </div>
</div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, dots = [];
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize(); window.addEventListener('resize',resize);
for(let i=0;i<90;i++) dots.push({x:Math.random()*9999,y:Math.random()*9999,r:Math.random()*1.5+.4,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,a:Math.random()});
function draw(){
  ctx.clearRect(0,0,W,H);
  dots.forEach(d=>{
    d.x+=d.vx; d.y+=d.vy;
    if(d.x<0||d.x>W)d.vx*=-1;
    if(d.y<0||d.y>H)d.vy*=-1;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,245,255,${.15+d.a*.25})`;
    ctx.fill();
  });
  dots.forEach((a,i)=>{
    for(let j=i+1;j<dots.length;j++){
      const b=dots[j], dx=a.x-b.x, dy=a.y-b.y, dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(0,245,255,${.06*(1-dist/120)})`;ctx.stroke()}
    }
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
